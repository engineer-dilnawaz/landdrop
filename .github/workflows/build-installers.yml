name: Build installers

# Run by hand from the Actions tab. Each job uploads its installer as a downloadable artifact;
# attach them to a GitHub release under these exact names.
on: workflow_dispatch

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: LANDrop-win-x64
          path: apps/desktop/release/LANDrop-win-x64.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist:mac && npm run dist:mac-intel
      - uses: actions/upload-artifact@v4
        with:
          name: LANDrop-mac
          path: |
            apps/desktop/release/LANDrop-mac-arm64.dmg
            apps/desktop/release/LANDrop-mac-x64.dmg
