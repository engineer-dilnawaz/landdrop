name: Release

# Every push to main builds the installers and publishes them as a GitHub release.
# The version is 0.2.<run number>, so it only ever goes up, which "Check for Updates" relies on.
# Changes that touch only docs or the website don't need new installers.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "site/**"]

env:
  VERSION: 0.2.${{ github.run_number }}

concurrency: release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm pkg set version=$VERSION --workspace @landrop/desktop
        shell: bash
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: installers-win
          path: apps/desktop/release/LANDrop-win-x64.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm pkg set version=$VERSION --workspace @landrop/desktop
      - run: npm run dist:mac && npm run dist:mac-intel
      - uses: actions/upload-artifact@v4
        with:
          name: installers-mac
          path: |
            apps/desktop/release/LANDrop-mac-arm64.dmg
            apps/desktop/release/LANDrop-mac-x64.dmg

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
      - run: gh release create "v$VERSION" LANDrop-*.dmg LANDrop-*.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LANDrop $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
